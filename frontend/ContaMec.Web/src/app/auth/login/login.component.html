<div class="login-page">
  <div class="login-card">
    <div class="login-card__brand" aria-hidden="true">
      <div class="login-card__logo">CM</div>
      <h1 class="login-card__title">ContaMEC</h1>
      <p class="login-card__tagline">Acceso seguro a su panel de contabilidad.</p>
    </div>

    <div class="login-card__body">
      <h2 class="section-title">Iniciar sesión</h2>
      <p class="section-hint">Introduzca sus credenciales para continuar.</p>

      <form (submit)="onFormSubmit($event)" novalidate class="login-form">
        <div class="field">
          <label class="field__label" for="login-username">Usuario</label>
          <input
            id="login-username"
            type="text"
            name="username"
            class="field__input"
            [value]="username"
            (input)="username = ($any($event.target).value)"
            autocomplete="username"
            [disabled]="loading"
            required
          />
        </div>

        <div class="field field--password">
          <label class="field__label" for="login-password">Contraseña</label>
          <div class="field__input-wrap">
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              class="field__input field__input--with-action"
              [value]="password"
              (input)="password = ($any($event.target).value)"
              autocomplete="current-password"
              [disabled]="loading"
              required
            />
            <button
              type="button"
              class="field__reveal"
              (click)="toggleShowPassword()"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.title]="showPassword ? 'Ocultar' : 'Mostrar'"
              [disabled]="loading"
            >
              <span class="visually-hidden">{{ showPassword ? 'Ocultar' : 'Mostrar' }} contraseña</span>
              <svg
                *ngIf="!showPassword"
                class="field__reveal-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                *ngIf="showPassword"
                class="field__reveal-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <p class="login-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="loading || !username.trim() || !password"
        >
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading" class="btn__loading" aria-live="polite">Entrando…</span>
        </button>
      </form>
    </div>
  </div>
</div>
