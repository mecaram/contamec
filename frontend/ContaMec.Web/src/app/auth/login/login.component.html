<div class="login-page">
  <div class="login-card">
    <div class="login-card__brand">
      <div class="login-card__logo" aria-hidden="true">4x</div>
      <h1 class="login-card__title">ContaMEC</h1>
      <p class="login-card__tagline">Contabilidad sin complicaciones.</p>
      <p class="login-card__credit">
        Desarrollado por
        <a href="https://4x.com.ar/" target="_blank" rel="noopener noreferrer">4x.com.ar</a>
      </p>
      <p class="login-card__credit login-card__demo">Solicitá tu demo gratis</p>
      <p class="login-card__credit login-card__contact">
        <a
          class="login-card__whatsapp"
          href="https://wa.me/5492241695973?text=Hola%2C%20vi%20ContaMEC%20y%20me%20gustar%C3%ADa%20solicitar%20una%20demo%20gratis."
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Contacto por WhatsApp: +54 9 2241 695973"
        >
          <svg class="login-card__whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.43 9.43 0 0 1-4.8-1.32l-.35-.2-3.57.93.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.24-9.44 9.45-9.44 2.52 0 4.89.99 6.67 2.77a9.37 9.37 0 0 1 2.76 6.68c0 5.21-4.24 9.44-9.44 9.44zm8.04-17.48A11.3 11.3 0 0 0 12.04.7C5.78.7.68 5.8.68 12.06c0 2 .52 3.96 1.52 5.68L.58 23.3l5.7-1.5a11.3 11.3 0 0 0 5.76 1.47h.01c6.26 0 11.36-5.1 11.36-11.36 0-3.03-1.18-5.89-3.33-8.03z"
            />
          </svg>
          Contacto: +54 9 2241 695973
        </a>
      </p>
    </div>

    <div class="login-card__body">
      <h2 class="section-title">Iniciar sesión</h2>
      <p class="section-hint">Introduzca sus credenciales para continuar.</p>

      <form (submit)="onFormSubmit($event)" novalidate class="login-form">
        <div class="field">
          <label class="field__label" for="login-username">Usuario</label>
          <input
            id="login-username"
            type="text"
            name="username"
            class="field__input"
            [value]="username"
            (input)="username = ($any($event.target).value)"
            autocomplete="username"
            [disabled]="loading"
            required
          />
        </div>

        <div class="field field--password">
          <label class="field__label" for="login-password">Contraseña</label>
          <div class="field__input-wrap">
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              class="field__input field__input--with-action"
              [value]="password"
              (input)="password = ($any($event.target).value)"
              autocomplete="current-password"
              [disabled]="loading"
              required
            />
            <button
              type="button"
              class="field__reveal"
              (click)="toggleShowPassword()"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              [attr.title]="showPassword ? 'Ocultar' : 'Mostrar'"
              [disabled]="loading"
            >
              <span class="visually-hidden">{{ showPassword ? 'Ocultar' : 'Mostrar' }} contraseña</span>
              <svg
                *ngIf="!showPassword"
                class="field__reveal-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                *ngIf="showPassword"
                class="field__reveal-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <p class="login-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="loading || !username.trim() || !password"
        >
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading" class="btn__loading" aria-live="polite">Entrando…</span>
        </button>

        <button type="button" class="btn btn--secondary" routerLink="/registrar-empresa" [disabled]="loading">
          Registrar Empresa
        </button>
      </form>
    </div>
  </div>
</div>
