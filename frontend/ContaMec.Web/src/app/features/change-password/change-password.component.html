<div class="change-password-page">
  <header class="change-password-page__header">
    <div>
      <h1 class="change-password-page__title">Cambiar contraseña</h1>
      <p class="change-password-page__subtitle">Ingrese su contraseña actual y la nueva contraseña.</p>
    </div>
    <button mat-stroked-button color="primary" type="button" routerLink="/dashboard">
      <mat-icon>arrow_back</mat-icon>
      Volver al menú principal
    </button>
  </header>

  <section class="change-password-panel mat-elevation-z1">
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="change-password-field" *ngFor="let field of fields">
        <label class="change-password-field__label" [for]="'cp-' + field.name">{{ field.label }}</label>
        <div class="change-password-field__wrap">
          <input
            [id]="'cp-' + field.name"
            class="change-password-field__control"
            [type]="visible[field.name] ? 'text' : 'password'"
            [formControlName]="field.name"
            [attr.autocomplete]="field.autocomplete"
          />
          <button
            type="button"
            class="change-password-field__reveal"
            (click)="toggleVisible(field.name)"
            [attr.aria-pressed]="visible[field.name]"
            [attr.aria-label]="visible[field.name] ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.title]="visible[field.name] ? 'Ocultar' : 'Mostrar'"
          >
            <svg *ngIf="!visible[field.name]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="visible[field.name]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div class="change-password-field__error" *ngIf="showRequired(field.name)">Este campo es obligatorio.</div>

        <ul class="change-password-rules" *ngIf="field.name === 'newPassword'" aria-live="polite">
          <li *ngFor="let rule of rules" [class.change-password-rules__item--ok]="rule.ok">
            <mat-icon class="change-password-rules__icon">{{ rule.ok ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
            {{ rule.label }}
          </li>
        </ul>

        <div class="change-password-field__error" *ngIf="field.name === 'confirmPassword' && showMismatch">
          La contraseña nueva y su repetición no coinciden.
        </div>
      </div>

      <div class="change-password-message change-password-message--error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
      <div class="change-password-message change-password-message--success" *ngIf="successMessage" role="status">{{ successMessage }}</div>

      <div class="change-password-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Guardar' }}
        </button>
        <button mat-button type="button" routerLink="/dashboard">Cancelar</button>
      </div>
    </form>
  </section>
</div>
