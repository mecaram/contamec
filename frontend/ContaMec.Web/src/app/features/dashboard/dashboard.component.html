<div class="dashboard">
  <header class="dashboard__header">
    <div class="dashboard__header-text">
      <h1 class="dashboard__title">ContaMEC</h1>
      <p class="dashboard__subtitle">Seleccione un módulo para continuar</p>
    </div>
    <button class="dashboard__logout" type="button" (click)="logout()">Cerrar sesión</button>
  </header>

  <main class="dashboard__main">
    <section
      class="dashboard__section"
      *ngFor="let category of categories; let i = index"
      [attr.aria-labelledby]="'dashboard-cat-' + i"
      [ngClass]="'dashboard__section--' + i"
    >
      <h2 class="dashboard__section-title" [id]="'dashboard-cat-' + i">{{ category.title }}</h2>

      <div
        class="dashboard__grid"
        *ngIf="category.items.length > 0; else emptyCategory"
        role="list"
      >
        <article
          class="dashboard-card mat-elevation-z2"
          *ngFor="let item of category.items"
          role="listitem"
          [routerLink]="item.route"
        >
          <div class="dashboard-card__content">
            <span class="dashboard-card__icon material-icons" aria-hidden="true">{{ item.icon }}</span>
            <span class="dashboard-card__label">{{ item.name }}</span>
          </div>
        </article>
      </div>

      <ng-template #emptyCategory>
        <div class="dashboard__empty" aria-hidden="true"></div>
      </ng-template>
    </section>
  </main>
</div>
