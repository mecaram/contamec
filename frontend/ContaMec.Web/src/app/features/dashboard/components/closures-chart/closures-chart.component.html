<div class="closures-chart mat-elevation-z2">

      baseChart
      chartType="bar"
      [datasets]="datasets"

      [options]="options"
      [legend]="true"
      role="img"
      aria-label="Ingresos, egresos y flujo neto de los últimos cierres"
    ></canvas>
  </div>
</div>
