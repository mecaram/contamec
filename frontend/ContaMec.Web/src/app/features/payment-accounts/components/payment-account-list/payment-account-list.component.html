<div class="payment-account-list">
  <div class="payment-account-list__loading" *ngIf="loading">Cargando cuentas de pago...</div>

  <div class="payment-account-list__empty" *ngIf="!loading && paymentAccounts.length === 0">
    No hay cuentas de pago para los filtros seleccionados.
  </div>

  <table class="payment-account-list__table mat-elevation-z1" *ngIf="!loading && paymentAccounts.length > 0">
    <thead>
      <tr>
        <th class="payment-account-list__sortable" (click)="setSort('id')">ID <span>{{ sortIndicator('id') }}</span></th>
        <th class="payment-account-list__sortable" (click)="setSort('name')">Nombre <span>{{ sortIndicator('name') }}</span></th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of sortedPaymentAccounts">
        <td>{{ row.id }}</td>
        <td>{{ row.name || '-' }}</td>
        <td class="payment-account-list__actions">
          <button mat-icon-button color="primary" type="button" (click)="onEdit(row)" aria-label="Editar cuenta de pago">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" type="button" (click)="onDelete(row)" aria-label="Eliminar cuenta de pago">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
    <tfoot>
      <tr class="payment-account-list__footer">
        <td colspan="3">Total registros: {{ totalRecords }}</td>
      </tr>
    </tfoot>
  </table>
</div>
